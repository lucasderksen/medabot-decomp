name: Progress

# Records decompilation coverage for every push to main and uploads an
# objdiff-format report (artifact A8BP_report). Coverage comes from
# config/segments.json, so no ROM is needed. History and charts live on the
# `progress` branch; each commit also gets a status with the percentage.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: progress
  cancel-in-progress: false

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out progress history
        run: |
          if git ls-remote --exit-code --heads origin progress >/dev/null; then
            git fetch --depth 1 origin progress
            git worktree add progress-data FETCH_HEAD
          else
            git worktree add --detach progress-data
            git -C progress-data checkout --orphan progress
            git -C progress-data rm -rf --quiet .
          fi

      - name: Measure progress
        id: measure
        run: |
          set -o pipefail
          python3 tools/progress_report.py --out progress-data --sha "$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY" | tee report.txt
          grep '^STATUS=' report.txt | sed 's/^STATUS=/status=/' >> "$GITHUB_OUTPUT"

      # objdiff-format report for progress trackers such as bytematch.dev, which
      # read the `<version>_report` artifact of push runs on main.
      - name: Generate objdiff report
        run: python3 tools/objdiff_report.py -o build/A8BP/report.json

      - name: Upload objdiff report
        uses: actions/upload-artifact@v4
        with:
          name: A8BP_report
          path: build/A8BP/report.json

      - name: Publish history
        working-directory: progress-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.csv progress.svg badge.svg progress.json
          git commit --quiet -m "Progress for ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git push origin HEAD:progress && exit 0
            sleep 5
          done
          exit 1

      - name: Set commit status
        env:
          GH_TOKEN: ${{ github.token }}
          DESCRIPTION: ${{ steps.measure.outputs.status }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=progress \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
